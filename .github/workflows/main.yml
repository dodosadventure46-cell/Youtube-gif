name: Build DodosMC APK (Tanpa Ekstrak)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile DodosMC Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Siapkan Proyek Otomatis (Tanpa Perlu Ekstrak Manual)
        shell: bash
        run: |
          set -e
          if [ -f "app/build.gradle.kts" ]; then
            echo "Struktur proyek sudah ada di repositori."
          elif ls *.zip >/dev/null 2>&1; then
            echo "Mendeteksi file ZIP di repositori, mengekstrak otomatis..."
            for z in *.zip; do
              unzip -o "$z"
            done
