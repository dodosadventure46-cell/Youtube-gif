      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Konfigurasi Android SDK & Compile DodosMC.apk
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$ANDROID_HOME/licenses/intel-android-extra-license"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Menyiapkan Gradle 8.7..."
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
          unzip -q -o /tmp/gradle-8.7.zip -d /tmp
          export PATH="/tmp/gradle-8.7/bin:$PATH"

          echo "Memulai kompilasi DodosMC.apk..."
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk DodosMC.apk
          ls -lh DodosMC.apk

      - name: Upload DodosMC.apk ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DodosMC-APK
          path: DodosMC.apk

      - name: Terbitkan Langsung DodosMC.apk ke GitHub Releases (Download Tanpa Ekstrak ZIP)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "DodosMC APK v1.0.${{ github.run_number }} (Siap Install)"
          body: |
            ### DodosMC Android APK Siap Pakai
            Unduh file **`DodosMC.apk`** di bawah ini dan langsung instal di HP Android kamu **tanpa perlu ekstrak file ZIP**.
          files: DodosMC.apk
